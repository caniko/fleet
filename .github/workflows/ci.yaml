        git config --global --add url.https://codeberg.org/.insteadOf ssh://git@codeberg.org/
        git config --global --add url.https://codeberg.org/.insteadOf git@codeberg.org:
    - name: Verify generated workflows
      run: nix develop --print-build-logs .#ci --command simit init ci --check --primary-only
    - env:
        BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
      id: plan
      name: Select affected components
      run: |
        set -euo pipefail
        if [ -n "$BASE_REVISION" ] && git cat-file -e "$BASE_REVISION^{commit}" 2>/dev/null; then
          nix develop --print-build-logs .#ci --command simit monorepo plan --base "$BASE_REVISION" --json > plan.json
        else
          nix develop --print-build-logs .#ci --command simit monorepo plan --json > plan.json
        fi
        selected=$(jq -c '.selected' plan.json)
        printf 'selected=%s\n' "$selected" >> "$GITHUB_OUTPUT"
        cat plan.json
      shell: bash
    timeout-minutes: 20
  qualified:
    if: ${{ always() }}
    needs:
    - plan
    - component-bootswain
    - component-infernix
    - component-libs
    - component-toolbelt
    runs-on: ubuntu-24.04
    steps:
    - env:
        OWNERS: '{"bootswain":"bootswain","canix-toolbelt":"toolbelt","dns-manager":"libs","fleetix":"libs","infernix":"infernix","nix-manager-core":"libs","secret-manager":"libs"}'
        RESULTS: ${{ toJSON(needs) }}
        SELECTED: ${{ needs.plan.outputs.selected }}
      name: Require every selected component
      run: printf '%s' "$RESULTS" | jq -e --argjson selected "$SELECTED" --argjson owners "$OWNERS" '. as $jobs | $jobs.plan.result == "success" and all($selected[]; $jobs["component-" + $owners[.]].result == "success")'
    timeout-minutes: 5
name: Monorepo qualification
on:
  pull_request: {}
  push:
    branches:
    - '**'
  workflow_dispatch: {}
permissions:
  contents: read
